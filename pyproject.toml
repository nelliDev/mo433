[project]
name = "mo433"
version = "0.1.0"
description = "Distilling unsupervised representations into small models (MO433 project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightly==1.6.0",
    "matplotlib>=3.9",
    "numpy>=2.5.4",
    "optuna>=4.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.31",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
mo433 = "mo433.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mo433"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "data: needs the STL-10 binaries under $MO433_DATA (default data/)",
    "gpu: needs a CUDA GPU",
    "weights: needs pretrained weights (timm/HF cache or network)",
    "slow: minutes-long end-to-end test (deselect with -m 'not slow')",
    "invariant: spec §9 invariant tests, run by `mo433 invariants` inside `mo433 all`",
]
