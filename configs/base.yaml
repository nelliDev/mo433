# Shared settings for every stage (spec §3, §5.1, §7.2). Loaded by mo433.config.load_config.
# Floats must contain a dot (1.0e-3, not 1e-3): PyYAML reads "1e-3" as a string.

n_images: 100000    # N unlabeled images in the view pool
k_views: 20         # K views per image
epochs: 100         # E
batch_size: 256     # pairs for B, images for C
head_width: 2048    # B expander / C projector hidden width; tuning grid may override per row-size file

optimizer:          # fallback until the Optuna study (spec §6.1) fills the winner
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.05
  warmup_epochs: 2
  betas: [0.9, 0.999]

probe:              # null until SVM selection by 5-fold CV on B-S-100-s0 (spec §7.2)
  linear_c: null
  rbf_c: null
  rbf_gamma: null

profiles:           # applied last; --profile picks one
  full: {}
  smoke:            # W1 dry run / pre-flight check (spec §9)
    n_images: 2000
    k_views: 2
    epochs: 2
